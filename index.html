<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dang Duyen Vi</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #203a54;
      background: #f2f7fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: radial-gradient(ellipse at top left, #dceeff, transparent 65%), #f2f7fc;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 840px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dce6f0;
      border-radius: 28px;
      box-shadow: 0 20px 60px #24466b10;
    }

    .page-nav {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px;
      border-bottom: 1px solid #dce6f0;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #bfd6f4;
      border-radius: 12px;
      background: #e6f2ff;
      color: #203a54;
      font-size: 0.9375rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .nav-button:hover { background: #d4e8ff; }
    .nav-button:focus-visible { outline: 3px solid #2449ce; outline-offset: 3px; }

    header {
      padding: 56px 52px;
      background: #e6f2ff;
      border-bottom: 1px solid #dce6f0;
    }

    .name-label {
      margin: 0 0 14px;
      color: #416180;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .details { padding: 12px 52px; }

    section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      align-items: baseline;
      gap: 16px 32px;
      padding: 30px 0;
    }

    section + section { border-top: 1px solid #e7edf5; }

    h2 {
      margin: 0;
      color: #53667a;
      font-size: 1rem;
      font-weight: 500;
    }

    section p {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 20px 28px;
      border-top: 1px solid #dce6f0;
      background: #f2f7fc;
      color: #53667a;
      font-size: 0.875rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 24px 16px; }
      main { border-radius: 22px; }
      header { padding: 36px 28px; }
      .details { padding: 8px 28px; }
      section { grid-template-columns: 1fr; gap: 8px; padding: 24px 0; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="name">
    <nav class="page-nav" aria-label="Điều hướng trang">
      <a class="nav-button" href="event.html">Sự kiện</a>
    </nav>
    <header>
      <p class="name-label">Họ và tên</p>
      <h1 id="name">Dang Duyen Vi</h1>
    </header>
    <div class="details">
      <section aria-labelledby="major">
        <h2 id="major">Chuyên ngành</h2>
        <p>Khoa Truyen Thong So</p>
      </section>
      <section aria-labelledby="skills">
        <h2 id="skills">Kỹ năng</h2>
        <p>Lam Clip, viet Code</p>
      </section>
      <section aria-labelledby="career">
        <h2 id="career">Mục tiêu nghề nghiệp</h2>
        <p>ky su</p>
      </section>
    </div>
    <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
