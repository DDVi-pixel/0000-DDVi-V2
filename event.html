<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Day</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #192645;
      background: #f1f4fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: radial-gradient(ellipse at top right, #dde6ff, transparent 65%), #f1f4fc;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 1040px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dce3f2;
      border-radius: 28px;
      box-shadow: 0 24px 64px #20355f14;
    }

    .page-nav {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px;
      border-bottom: 1px solid #dce6f0;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #bfd6f4;
      border-radius: 12px;
      background: #e6f2ff;
      color: #203a54;
      font-size: 0.9375rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .nav-button:hover { background: #d4e8ff; }
    .nav-button:focus-visible { outline: 3px solid #2449ce; outline-offset: 3px; }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 32px;
      align-items: start;
      padding: 48px;
      color: #ffffff;
      background: linear-gradient(120deg, #2449ce, #5140c9);
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 390px;
      height: 390px;
      right: -150px;
      bottom: -220px;
      border: 54px solid #ffffff12;
      border-radius: 50%;
      pointer-events: none;
    }

    .label {
      margin: 0 0 12px;
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-size: clamp(3.25rem, 8vw, 5.75rem);
      font-weight: 800;
      line-height: 1.03;
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
    }

    .audience {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
      margin-top: 28px;
    }

    .audience .label { margin: 0; color: #e0e7ff; }
    .audience p { margin: 0; font-size: 1.125rem; font-weight: 600; }

    .cost {
      padding: 18px 24px;
      border-radius: 18px;
      color: #213a1b;
      background: #d9ffa2;
    }

    .cost .label { margin-bottom: 4px; }
    .cost p { margin: 0; font-size: 1.5rem; font-weight: 750; }

    .details { padding: 28px; }

    .schedule {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .schedule section {
      min-width: 0;
      padding: 26px 22px;
      border-radius: 18px;
    }

    .date { background: #eaf2ff; color: #193d80; }
    .time { background: #f0edff; color: #443278; }
    .deadline { background: #ffe5d9; color: #773516; }

    .schedule p {
      margin: 0;
      font-size: clamp(1.5rem, 2.8vw, 2rem);
      font-weight: 750;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
    }

    .venue {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 24px;
      padding: 28px 8px 4px;
    }

    .venue .label { margin: 0; color: #586781; }
    .venue p { margin: 0; font-size: 1.125rem; font-weight: 600; }

    @media (max-width: 760px) {
      body { padding: 24px 16px; }
      .hero { padding: 32px; }
      .schedule { grid-template-columns: 1fr; }
      .schedule section { padding: 24px; }
      .schedule p { font-size: 2rem; }
      .details { padding: 20px; }
    }

    @media (max-width: 480px) {
      main { border-radius: 22px; }
      .hero { grid-template-columns: 1fr; gap: 24px; padding: 28px 24px; }
      .cost { justify-self: start; padding: 14px 20px; }
      .cost p { font-size: 1.25rem; }
      .details { padding: 16px; }
      .schedule p { font-size: 1.75rem; }
      .venue { padding: 24px 8px 8px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="event-title">
    <nav class="page-nav" aria-label="Điều hướng trang">
      <a class="nav-button" href="index.html">Giới thiệu về tôi</a>
    </nav>
    <header class="hero">
      <div>
        <p class="label">Tên sự kiện</p>
        <h1 id="event-title">AI Career Day</h1>
        <div class="audience">
          <p class="label">Đối tượng</p>
          <p>Sinh viên đại học</p>
        </div>
      </div>
      <div class="cost">
        <p class="label">Chi phí</p>
        <p>Miễn phí</p>
      </div>
    </header>

    <div class="details">
      <div class="schedule">
        <section class="date" aria-labelledby="date-label">
          <h2 class="label" id="date-label">Ngày</h2>
          <p>15 tháng 11</p>
        </section>
        <section class="time" aria-labelledby="time-label">
          <h2 class="label" id="time-label">Thời gian</h2>
          <p>14:00–16:00</p>
        </section>
        <section class="deadline" aria-labelledby="deadline-label">
          <h2 class="label" id="deadline-label">Hạn đăng ký</h2>
          <p>10 tháng 11</p>
        </section>
      </div>
      <section class="venue" aria-labelledby="venue-label">
        <h2 class="label" id="venue-label">Địa điểm</h2>
        <p>Phòng hội thảo A</p>
      </section>
    </div>
  </main>
</body>
</html>
